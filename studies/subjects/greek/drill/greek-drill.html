<title>Greek Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a chapter-grouped deck list on the left (stacks on top on phones), one working card on the right,
   the results log under the card. Greek is set in a book face; everything else in a quiet sans. */
:root {
  --bg: #eef1ee;
  --panel: #f8faf8;
  --surface: #ffffff;
  --ink: #18211e;
  --muted: #5b6863;
  --line: #d4dcd7;
  --accent: #2c5a4e;
  --accent-ink: #ffffff;
  --accent-soft: #dfeae5;
  --good: #1f7348;
  --good-soft: #e0f1e6;
  --bad: #a83a2c;
  --bad-soft: #f7e3df;
  --greek: "Gentium Book Plus", "Gentium Plus", "Times New Roman", serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --panel: #161e1b; --surface: #1b2420; --ink: #e3ebe7; --muted: #94a59e; --line: #2b3732;
    --accent: #7fc0aa; --accent-ink: #0f1a16; --accent-soft: #1f3530; --good: #69c793; --good-soft: #16321f;
    --bad: #ef8f80; --bad-soft: #3b1f1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --panel: #161e1b; --surface: #1b2420; --ink: #e3ebe7; --muted: #94a59e; --line: #2b3732;
  --accent: #7fc0aa; --accent-ink: #0f1a16; --accent-soft: #1f3530; --good: #69c793; --good-soft: #16321f;
  --bad: #ef8f80; --bad-soft: #3b1f1a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
header.top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--greek); font-size: 30px; font-weight: 700; margin: 0; letter-spacing: .01em; }
h1 span { color: var(--accent); font-style: italic; font-weight: 400; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }

/* Deck list */
nav.decks { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow-y: auto; }
.navtoggle { display: none; }
.group { display: flex; flex-direction: column; gap: 1px; padding-block: 6px 4px; }
.group + .group { border-top: 1px solid var(--line); }
.group h2 { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 2px 10px 4px; }
.deck { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14.5px; }
.deck:hover { background: var(--accent-soft); }
.deck[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.deck .score { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.deck[aria-current="true"] .score { color: var(--accent-ink); opacity: .85; }
.deck .score.full { color: var(--good); font-weight: 600; }
.deck.sheet { font-style: italic; }

/* Main column */
main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.meta .deckname { font-weight: 700; }
.meta .count { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .25s; }
.bar i.ok { background: var(--good); }
.bar i.miss { background: var(--bad); }
.ask { margin: 0; font-size: 15px; color: var(--muted); }
.prompt { font-family: var(--greek); font-size: clamp(34px, 7vw, 60px); line-height: 1.15; text-align: center; padding-block: 14px; overflow-wrap: anywhere; }
.prompt.long { font-size: clamp(24px, 4.5vw, 36px); }
.prompt.label { font-family: var(--body); font-size: clamp(22px, 4vw, 30px); font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.choices.greek { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.choice { position: relative; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 11px 12px 11px 34px; text-align: left; cursor: pointer; font-size: 15.5px; min-height: 48px; }
.choices.greek .choice { font-family: var(--greek); font-size: 24px; text-align: center; padding-left: 26px; }
.choice kbd { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); }
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choice:disabled { cursor: default; opacity: .55; }
.choice.right { opacity: 1; border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600; }
.choice.wrong { opacity: 1; border-color: var(--bad); background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
form.typed { display: flex; gap: 8px; }
input[type="text"] { flex: 1; min-width: 0; font-family: var(--mono); font-size: 18px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
input[type="text"]:disabled { opacity: .7; }
.btn { font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions .spacer { flex: 1; }
.tip { font-size: 13px; color: var(--muted); }
.tip kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.fb { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.fb.good { background: var(--good-soft); color: var(--good); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb .head { font-weight: 700; }
.fb .why { color: var(--ink); }
.fb .ans { font-family: var(--mono); font-weight: 600; }
.fb .gk { font-family: var(--greek); font-size: 1.15em; }
.prev { font-size: 13.5px; color: var(--good); }
.done { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-block: 12px; }
.done .big { font-family: var(--greek); font-size: 56px; margin: 0; font-variant-numeric: tabular-nums; }
.done ul { text-align: left; margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; }

/* Study sheets */
.sheet-body { display: flex; flex-direction: column; gap: 14px; }
.sheet-body h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.sheet-body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.sheet-body p { margin: 0; }
.tablewrap { overflow-x: auto; }
.para { border-collapse: collapse; font-size: 16px; min-width: 100%; }
.para th, .para td { border: 1px solid var(--line); padding: 5px 12px; text-align: left; white-space: nowrap; }
.para th { color: var(--muted); font-weight: 600; font-size: 13px; background: var(--panel); }
.para td { font-family: var(--greek); font-size: 18px; }
.para td b { color: var(--accent); }
.keytable { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.keytable > div { display: flex; align-items: baseline; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.keytable span { font-family: var(--greek); font-size: 22px; }
.keytable code { font-family: var(--mono); font-weight: 600; color: var(--accent); }
.keytable small { color: var(--muted); font-size: 12px; }

/* Results */
.results { display: flex; flex-direction: column; gap: 8px; }
.results h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
pre { margin: 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: 260px; overflow: auto; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  nav.decks { position: static; max-height: none; }
  .navtoggle { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: transparent; padding: 8px 10px; cursor: pointer; font-weight: 700; }
  nav.decks.closed .group { display: none; }
  .keytable { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 18px 16px 20px; }
}
@media (max-width: 420px) { form.typed { flex-direction: column; } .choices { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <h1>Greek <span>Drill</span></h1>
    <p class="sub">Mounce, BBG · review blocks A–C, ch. 3–7</p>
  </header>

  <nav class="decks" id="nav" aria-label="Decks">
    <button class="navtoggle" id="navtoggle" type="button" aria-expanded="true"><span id="navnow">Decks</span><span aria-hidden="true">▾</span></button>
  </nav>

  <main>
    <section class="card" id="card" aria-live="polite"></section>
    <section class="results">
      <h2>Results to paste back to Claude</h2>
      <pre id="log">No rounds finished yet.</pre>
      <div class="actions">
        <button class="btn ghost small" id="copy" type="button">Copy results</button>
        <span class="tip" id="copied"></span>
      </div>
    </section>
  </main>
</div>

<template id="sheet-key">
  <div class="sheet-body">
    <p>Type Greek with English letters. Accents and capitals don't matter. Rough breathing is an <code>h</code> at the front.</p>
    <div class="keytable">
      <div><span lang="el">ω</span><code>w</code></div>
      <div><span lang="el">η</span><code>h</code><small>or ey</small></div>
      <div><span lang="el">θ</span><code>th</code></div>
      <div><span lang="el">φ</span><code>ph</code></div>
      <div><span lang="el">χ</span><code>ch</code></div>
      <div><span lang="el">ψ</span><code>ps</code></div>
      <div><span lang="el">ξ</span><code>x</code><small>or xs</small></div>
      <div><span lang="el">υ</span><code>u</code><small>or y</small></div>
    </div>
    <p class="tip">So ου is <code>ou</code>, ῳ is <code>w</code>, ἡ is <code>hh</code>, τῆς is <code>ths</code>.</p>
    <h3>How a round works</h3>
    <ul>
      <li>Pick a deck on the left. In choice decks, press the number keys <kbd>1</kbd>–<kbd>9</kbd> or click.</li>
      <li>A wrong answer stops on the explanation. Press <kbd>Enter</kbd> to go on. The item comes back a few questions later.</li>
      <li>Only first tries count toward the score.</li>
      <li>When you're done, press <b>Copy results</b> and paste them in the chat.</li>
    </ul>
  </div>
</template>

<template id="sheet-6">
  <div class="sheet-body">
    <h3>Endings alone (§6.13)</h3>
    <div class="tablewrap"><table class="para"><tr><th></th><th>masc</th><th>fem</th><th>neut</th></tr>
      <tr><th>nom sg</th><td>ς</td><td>(none)</td><td>ν</td></tr>
      <tr><th>acc sg</th><td>ν</td><td>ν</td><td>ν</td></tr>
      <tr><th>nom pl</th><td>ι</td><td>ι</td><td>α</td></tr>
      <tr><th>acc pl</th><td>υς</td><td>ς</td><td>α</td></tr></table></div>
    <h3>With the article (§6.22)</h3>
    <div class="tablewrap"><table class="para" lang="el"><tr><th></th><th>masc</th><th>fem η</th><th>fem α</th><th>neut</th></tr>
      <tr><th>nom sg</th><td>ὁ λόγος</td><td>ἡ γραφή</td><td>ἡ ὥρα</td><td>τὸ ἔργον</td></tr>
      <tr><th>acc sg</th><td>τὸν λόγον</td><td>τὴν γραφήν</td><td>τὴν ὥραν</td><td>τὸ ἔργον</td></tr>
      <tr><th>nom pl</th><td>οἱ λόγοι</td><td>αἱ γραφαί</td><td>αἱ ὧραι</td><td>τὰ ἔργα</td></tr>
      <tr><th>acc pl</th><td>τοὺς λόγους</td><td>τὰς γραφάς</td><td>τὰς ὥρας</td><td>τὰ ἔργα</td></tr></table></div>
    <h3>Patterns (§6.14, §6.16, §6.23)</h3>
    <ul>
      <li><b>ν = accusative singular</b> in every gender.</li>
      <li><b>vowel + ι = nominative plural</b>: οι masculine, αι feminine.</li>
      <li><b>vowel + ς = accusative plural</b>: ους masculine, ας feminine.</li>
      <li><b>Neuter: nom = acc</b> (rule 2), plural ends in <b>α</b> (rule 3).</li>
      <li><b>The feminine article has η in the singular</b>, even on an α noun: ἡ ὥρα.</li>
      <li><b>η nouns switch to α in the plural</b>: γραφή → γραφαί.</li>
      <li><b>The ending finds the subject, not the position</b>: ψυχὰς σώσει θεός = God will save souls.</li>
    </ul>
  </div>
</template>

<template id="sheet-7">
  <div class="sheet-body">
    <h3>The full chart (§7.11; ὥρα plural built on §7.14)</h3>
    <div class="tablewrap"><table class="para" lang="el"><tr><th></th><th>masc</th><th>fem η</th><th>fem α</th><th>neut</th></tr>
      <tr><th>nom sg</th><td>ὁ λόγος</td><td>ἡ γραφή</td><td>ἡ ὥρα</td><td>τὸ ἔργον</td></tr>
      <tr><th>gen sg</th><td><b>τοῦ λόγου</b></td><td><b>τῆς γραφῆς</b></td><td><b>τῆς ὥρας</b></td><td><b>τοῦ ἔργου</b></td></tr>
      <tr><th>dat sg</th><td><b>τῷ λόγῳ</b></td><td><b>τῇ γραφῇ</b></td><td><b>τῇ ὥρᾳ</b></td><td><b>τῷ ἔργῳ</b></td></tr>
      <tr><th>acc sg</th><td>τὸν λόγον</td><td>τὴν γραφήν</td><td>τὴν ὥραν</td><td>τὸ ἔργον</td></tr>
      <tr><th>nom pl</th><td>οἱ λόγοι</td><td>αἱ γραφαί</td><td>αἱ ὧραι</td><td>τὰ ἔργα</td></tr>
      <tr><th>gen pl</th><td><b>τῶν λόγων</b></td><td><b>τῶν γραφῶν</b></td><td><b>τῶν ὡρῶν</b></td><td><b>τῶν ἔργων</b></td></tr>
      <tr><th>dat pl</th><td><b>τοῖς λόγοις</b></td><td><b>ταῖς γραφαῖς</b></td><td><b>ταῖς ὥραις</b></td><td><b>τοῖς ἔργοις</b></td></tr>
      <tr><th>acc pl</th><td>τοὺς λόγους</td><td>τὰς γραφάς</td><td>τὰς ὥρας</td><td>τὰ ἔργα</td></tr></table></div>
    <h3>True endings (§7.8)</h3>
    <div class="tablewrap"><table class="para"><tr><th></th><th>masc</th><th>fem</th><th>neut</th></tr>
      <tr><th>nom sg</th><td>ς</td><td>(none)</td><td>ν</td></tr>
      <tr><th>gen sg</th><td><b>υ</b></td><td><b>ς</b></td><td><b>υ</b></td></tr>
      <tr><th>dat sg</th><td><b>ι</b></td><td><b>ι</b></td><td><b>ι</b></td></tr>
      <tr><th>acc sg</th><td>ν</td><td>ν</td><td>ν</td></tr>
      <tr><th>nom pl</th><td>ι</td><td>ι</td><td>α</td></tr>
      <tr><th>gen pl</th><td><b>ων</b></td><td><b>ων</b></td><td><b>ων</b></td></tr>
      <tr><th>dat pl</th><td><b>ις</b></td><td><b>ις</b></td><td><b>ις</b></td></tr>
      <tr><th>acc pl</th><td>υς</td><td>ς</td><td>α</td></tr></table></div>
    <h3>Patterns (§7.4–7.15)</h3>
    <ul>
      <li><b>Genitive = "of"</b>, and it follows its head noun: ὁ λόγος τοῦ θεοῦ.</li>
      <li><b>Dative = "to"</b> (also in, with). The indirect object is dative.</li>
      <li><b>Subscript ι = dative singular</b>, nothing else (rule 4).</li>
      <li><b>ων = genitive plural</b> in every gender.</li>
      <li><b>Masc = neut in gen and dat</b> (rule 6).</li>
      <li><b>ας is gen sg or acc pl</b>: the article decides (τῆς ὥρας / τὰς ὥρας).</li>
      <li><b>α after ε, ι, ρ stays</b> (ὥρας); otherwise gen/dat sg shift to η (δόξης, δόξῃ).</li>
      <li><b>Ἰησοῦ is gen or dat</b>: the article decides (§7.13).</li>
    </ul>
  </div>
</template>

<script>
// Letters from BBG §3.2 chart. Answers use our typing key: w = ω; H = η (h or ey);
// U = υ (u or y); X = ξ (x or xs).
const LETTERS = [
  ["α","alpha","a"],["β","beta","b"],["γ","gamma","g"],["δ","delta","d"],["ε","epsilon","e"],
  ["ζ","zeta","z"],["η","eta","H"],["θ","theta","th"],["ι","iota","i"],["κ","kappa","k"],
  ["λ","lambda","l"],["μ","mu","m"],["ν","nu","n"],["ξ","xi","X"],["ο","omicron","o"],
  ["π","pi","p"],["ρ","rho","r"],["σ","sigma","s"],["τ","tau","t"],["υ","upsilon","U"],
  ["φ","phi","ph"],["χ","chi","ch"],["ψ","psi","ps"],["ω","omega","w"]
];
// BBG §3.3.3: do not confuse η/n, ν/v, ρ/p, χ/x, ω/w. π added: read as ν in session.
const LOOKALIKE_NOTE = {
  "η": "η is eta: type h (its capital is H). It is not the English n.",
  "ν": "ν is nu (n). It is not the English v.",
  "ρ": "ρ is rho (r). It is not the English p.",
  "χ": "χ is chi (ch). It is not the English x.",
  "ω": "ω is omega, a long o: type w.",
  "π": "π is pi (p), the little table. ν is nu (n)."
};
const NAME_ALT = { "xi": ["xi","xsi"], "omicron": ["omicron","o micron"], "upsilon": ["upsilon","ypsilon"] };
const WORDS = [
  ["λόγος","logos"],["ἀπόστολος","apostolos"],["Χριστός","christos"],["θεός","theos"],
  ["ἀγαπῶ","agapw"],["ποιοῦμεν","poioUmen"],["πληρόω","plHrow"],["ἀδελφός","adelphos"],
  ["ἄνθρωπος","anthrwpos"],["γραφή","graphH"],["ζωή","zwH"],["καρδία","kardia"],
  ["φωνή","phwnH"],["ἔχω","echw"],["πνεῦμα","pneUma"],["βλέπω","blepw"],
  ["ἀκούω","akoUw"],["λέγω","legw"],["πιστεύω","pisteUw"],["ψυχή","psUchH"],
  ["ἀγαπᾶτε","agapate"],["πληροῦτε","plHroUte"],["ποιεῖτε","poieite"]
];
// BBG §3.3.4: ς only at the end of a word, σ elsewhere.
const SIGMA = [
  ["λόγο_","ς"],["ἀπό_τολος","σ"],["Χρι_τός","σ"],["θεό_","ς"],["πι_τεύω","σ"],
  ["ἀδελφό_","ς"],["_ῴζω","σ"],["ἄνθρωπο_","ς"],["ἀκούει_","ς"],["ἀγαπᾷ_","ς"]
];

// BBG §3.4.6: rough breathing (῾) adds an h sound; smooth (᾿) is silent; every word
// starting with ρ or υ takes rough. Each item: [word, answer, why].
const BREATHING = [
  ["ὑπέρ","rough","Every word starting with υ takes rough: huper (§3.4.6)."],
  ["ῥῆμα","rough","Every word starting with ρ takes rough (§3.4.6)."],
  ["ἀπόστολος","smooth","Smooth: apostolos, no h (§3.4.6)."],
  ["ἄγγελος","smooth","Smooth: no h."],
  ["ὁ","rough","Rough: ho."],
  ["ἐγώ","smooth","Smooth: no h."],
  ["ἁμαρτία","rough","Rough: hamartia."],
  ["ἀκούω","smooth","Smooth: no h."]
];
// BBG §3.4.4 gamma nasal (γγ said as ng) and §3.4.6 rough breathing h.
const SOUNDS = [
  ["ἄγγελος","angelos"],["ὑπέρ","hUper"],["ἀπόστολος","apostolos"],["ὁ","ho"],["ἁμαρτία","hamartia"]
];

  breathing: { label: "Breathing marks", ask: "Rough (h sound) or smooth (no sound)?", kind: "choice", options: ["rough", "smooth"], items: () => BREATHING },
  sound: { label: "Say it", ask: "Type how it sounds (typing key)", kind: "word", items: () => SOUNDS },
  diph: { label: "Diphthongs", ask: "Which English word has this sound?", kind: "choice",
    options: ["aisle", "eight", "oil", "sauerkraut", "soup", "suite", "feud"], items: () => DIPH },
  marks: { label: "Ch 4: Marks", ask: "What is this mark in Greek?", kind: "choice",
    options: ["comma", "period", "semicolon", "question mark", "acute", "grave", "circumflex", "elision"], items: () => MARKS },
  count: { label: "Ch 4: Count syllables", ask: "How many syllables? One per vowel or diphthong.", kind: "choice",
    options: ["2", "3", "4", "5", "6"], items: () => COUNT },
  syll: { label: "Ch 4: Split it", ask: "Split the Greek, then type it in English with spaces (like gra phh). θ φ χ ψ are one letter each.", kind: "word", items: () => SYLL },
  rules: { label: "Ch 4: Which rule?", ask: "Which rule makes the split at | ?", kind: "choice",
    options: ["single consonant", "vowels split", "can't say together", "can say together", "double", "compound"], items: () => RULES },
  endings: { label: "Ch 6: Endings alone", ask: "Which ending goes in this slot?", kind: "choice", greek: true, labelPrompt: true,
    options: ["ς", "ν", "ι", "υς", "α", "none"], items: () => ENDINGS },
  decline: { label: "Ch 6: Decline it", ask: "Type the form in the typing key (like logous)", kind: "word", items: () => DECLINE },
  phrase: { label: "Ch 6: Read the article", ask: "Case and number? Use the article.", kind: "choice",
    options: ["nom sg", "acc sg", "nom pl", "acc pl", "nom/acc sg", "nom/acc pl"], items: () => PHRASE },
  article: { label: "Ch 6: Add the article", ask: "Type the article for this noun (ὁ = ho, ἡ = hh, τόν = ton)", kind: "word", items: () => ARTICLE },
  parse: { label: "Ch 6: Parse it", ask: "Case and number?", kind: "choice",
    options: ["nom sg", "acc sg", "nom pl", "acc pl", "nom/acc sg", "nom/acc pl"], items: () => PARSE },
  nrules: { label: "Ch 6: Noun rules", ask: "Pick the answer", kind: "choice",
    options: ["1st declension", "2nd declension", "3rd declension", "nom and acc", "α", "case, number, gender", "ὁ", "there is none"], items: () => NRULES },
  subj: { label: "Ch 6: Subject or object", ask: "Pick the word", kind: "choice", greek: true, items: () => SUBJ,
    optionsFor: it => it[0].split(" — ")[0].replace(".", "").split(" ").reduce((a, w, i, ws) => {
      const ART = ["ὁ", "τὸν", "τὴν", "τοὺς", "τὰς", "οἱ", "αἱ"];
      if (ART.includes(w)) return a; const prev = ws[i - 1]; a.push(ART.includes(prev) ? prev + " " + w : w); return a; }, []) },
  end7: { label: "Ch 7: Endings alone", ask: "Which true ending goes in this slot? (§7.8)", kind: "choice", greek: true, labelPrompt: true,
    options: ["ς", "ν", "ι", "υ", "υς", "α", "ων", "ις", "none"], items: () => ENDINGS7 },
  artchart7: { label: "Ch 7: Article chart", ask: "Type the article for this slot (τοῦ = tou, τῷ = tw, τῆς = ths)", kind: "word", labelPrompt: true, items: () => ARTCHART7 },
  art7: { label: "Ch 7: Read the article", ask: "Case and number of this article?", kind: "choice", options: CASES, items: () => ART7 },
  artg7: { label: "Ch 7: Article gender", ask: "Which gender can this article be?", kind: "choice", options: GENDERS, items: () => ARTG7 },
  parse7: { label: "Ch 7: Parse it", ask: "Case and number?", kind: "choice", options: CASES, items: () => PARSE7 },
  decl7: { label: "Ch 7: Decline it", ask: "Type the form (ου = ou, ῳ = w, η = h)", kind: "word", items: () => DECLINE7 },
  rules7: { label: "Ch 7: Rules and key words", ask: "Pick the answer", kind: "choice", items: () => NRULES7,
    optionsFor: it => it[0].includes("Gen sg?") ? (it[1].startsWith("δ") ? ["δόξας", "δόξης"] : it[1].startsWith("ὥ") ? ["ὥρας", "ὥρης"] : ["ἁμαρτίας", "ἁμαρτίης"])
      : ["of", "to", "in", "nominative", "genitive", "dative", "accusative", "iota subscripts", "vowels change length", "masc = neut in gen and dat", "ων", "ις"] },
  read7: { label: "Ch 7: Translate", ask: "Pick the translation", kind: "choice", items: () => READ7,
    optionsFor: it => shuffle([it[1], ...shuffle(READ7.filter(x => x !== it).map(x => x[1])).slice(0, 3)]) },
  mix7: { label: "Ch 7: Mixed review", ask: "", kind: "mixed", items: () =>
    ["end7", "art7", "parse7", "decl7", "read7"].flatMap(k => shuffle(DECKS[k].items()).slice(0, 4).map(it => ({ it, src: k }))) }
};

// Deck list grouped by chapter. Sheets open a study page instead of a round.
const GROUPS = [
  { title: "Start here", entries: [{ sheet: "key", label: "Typing key and how to use" }] },
  { title: "Ch 3 · Alphabet", entries: ["lookalike", "names", "english", "words", "sigma", "breathing", "sound", "diph"] },
  { title: "Ch 4 · Marks and syllables", entries: ["marks", "count", "syll", "rules"] },
  { title: "Ch 6 · Nominative and accusative", entries: [{ sheet: "6", label: "Study sheet" }, "endings", "decline", "phrase", "article", "parse", "nrules", "subj"] },
  { title: "Ch 7 · Genitive and dative", entries: [{ sheet: "7", label: "Study sheet" }, "end7", "artchart7", "art7", "artg7", "parse7", "decl7", "rules7", "read7", "mix7"] }
];
const SHEETS = { key: "Typing key and how to use", "6": "Ch 6 study sheet", "7": "Ch 7 study sheet" };

function clean(s) {
  return s.toLowerCase().replace(/ō/g, "w").replace(/ē/g, "ey").normalize("NFD")
    .replace(/[̀-ͯ]/g, "").replace(/[^a-z ]/g, "").replace(/\s+/g, " ").trim();
}
// Every accepted spelling of an answer: H -> ey|h, U -> u|y, X -> x|xs.
function variants(ans) {
  let out = [""];
  for (const c of ans) {
    const opts = c === "H" ? ["ey", "h"] : c === "U" ? ["u", "y"] : c === "X" ? ["x", "xs"] : [c];
    out = out.flatMap(o => opts.map(x => o + x));
  }
  return out;
}
function show(ans) { return ans.replace(/H/g, "h").replace(/U/g, "u").replace(/X/g, "x"); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])); }
function shortLabel(l) { return l.replace(/^Ch \d: /, ""); }
const isGreek = s => /[Ͱ-Ͽἀ-῿]/.test(s);
const narrow = () => matchMedia("(max-width: 760px)").matches;

const card = document.getElementById("card");
const nav = document.getElementById("nav");
const logEl = document.getElementById("log");
let state = null;
let history = load("gd-history", []);
let lastScores = load("gd-last", {});

function renderLog() {
  const today = new Date().toISOString().slice(0, 10), shown = history.filter(l => l.startsWith(today));
  logEl.textContent = shown.length ? shown.join("\n") : history.length ? history.slice(-8).join("\n") : "No rounds finished yet.";
}

function renderNav(active) {
  nav.querySelectorAll(".group").forEach(g => g.remove());
  for (const g of GROUPS) {
    const sec = document.createElement("div");
    sec.className = "group";
    sec.innerHTML = `<h2>${esc(g.title)}</h2>`;
    for (const e of g.entries) {
      const b = document.createElement("button");
      b.type = "button";
      if (typeof e === "string") {
        const d = DECKS[e], s = lastScores[e];
        b.className = "deck"; b.dataset.key = e;
        b.innerHTML = `<span>${esc(shortLabel(d.label))}</span>${s ? `<span class="score${s[0] === s[1] ? " full" : ""}">${s[0]}/${s[1]}</span>` : ""}`;
        b.addEventListener("click", () => { start(e); collapseNav(); });
      } else {
        b.className = "deck sheet"; b.dataset.key = "sheet:" + e.sheet;
        b.innerHTML = `<span>${esc(e.label)}</span>`;
        b.addEventListener("click", () => { openSheet(e.sheet); collapseNav(); });
      }
      b.setAttribute("aria-current", b.dataset.key === active);
      sec.appendChild(b);
    }
    nav.appendChild(sec);
  }
  const cur = active && (active.startsWith("sheet:") ? SHEETS[active.slice(6)] : DECKS[active]?.label);
  document.getElementById("navnow").textContent = cur ? "Deck: " + cur : "Decks";
}
function collapseNav() { if (narrow()) { nav.classList.add("closed"); document.getElementById("navtoggle").setAttribute("aria-expanded", "false"); } }
document.getElementById("navtoggle").addEventListener("click", () => {
  const closed = nav.classList.toggle("closed");
  document.getElementById("navtoggle").setAttribute("aria-expanded", String(!closed));
});

function openSheet(id) {
  state = null;
  store("gd-deck", "sheet:" + id);
  renderNav("sheet:" + id);
  const next = id === "6" ? "endings" : id === "7" ? "end7" : "lookalike";
  card.innerHTML = `<div class="meta"><span class="deckname">${esc(SHEETS[id])}</span></div>
    ${document.getElementById("sheet-" + id).innerHTML}
    <div class="actions"><button class="btn" id="go" type="button">Start ${esc(DECKS[next].label)}</button></div>`;
  document.getElementById("go").addEventListener("click", () => start(next));
}

function start(deckKey) {
  store("gd-deck", deckKey);
  renderNav(deckKey);
  const d = DECKS[deckKey];
  const raw = d.kind === "mixed" ? d.items() : shuffle(d.items()).map(it => ({ it, src: deckKey }));
  state = { deckKey, d, queue: raw.map((q, i) => ({ ...q, id: i })), total: raw.length,
    firstTry: new Set(), missed: new Map(), stage: 0, phase: "ask", prev: "" };
  render();
}

// The deck that defines how the current item is asked (differs from the round in a mixed deck).
function srcDeck(q) { return DECKS[q.src]; }
function kindOf(q) { const d = srcDeck(q); return d.kind === "both" ? (state.stage === 0 ? "name" : "translit") : d.kind; }
function optionsOf(q) { const d = srcDeck(q); return d.optionsFor ? d.optionsFor(q.it) : d.options; }
function answerOf(q, kind) {
  if (kind === "name") return NAME_ALT[q.it[1]] || [q.it[1]];
  if (kind === "translit") return [q.it[2]];
  if (kind === "word") return q.it[1].split("|");
  return [q.it[1]];
}

function render() {
  if (!state.queue.length) return finish();
  const q = state.queue[0], d = srcDeck(q), it = q.it, kind = kindOf(q);
  const done = state.firstTry.size, missedN = state.missed.size;
  const askText = d.kind === "both" ? (kind === "name" ? "Step 1 of 2: type the letter's name (like alpha)" : "Step 2 of 2: type it in English letters (like a)") : d.ask;
  const promptCls = d.labelPrompt ? " label" : it[0].length > 14 ? " long" : "";
  const opts = kind === "choice" ? (state.opts ||= optionsOf(q)) : null;
  const greekOpts = opts && opts.some(isGreek) && opts.every(o => o.length < 12);
  card.innerHTML = `
    <div class="meta"><span class="deckname">${esc(state.d.label)}${state.d.kind === "mixed" ? ` <span class="tip">· ${esc(shortLabel(d.label))}</span>` : ""}</span>
      <span class="count">${done} right first try · ${missedN} missed · ${state.queue.length} left of ${state.total}</span></div>
    <div class="bar" aria-hidden="true"><i class="ok" style="width:${100 * done / state.total}%"></i><i class="miss" style="width:${100 * missedN / state.total}%"></i></div>
    ${state.prev}
    <p class="ask">${esc(askText)}</p>
    <div class="prompt${promptCls}" lang="${d.labelPrompt ? "en" : "el"}">${esc(it[0])}</div>
    ${kind === "choice"
      ? `<div class="choices${greekOpts ? " greek" : ""}" role="group" aria-label="Choices">${opts.map((o, i) =>
          `<button class="choice" type="button" data-i="${i}"${state.phase !== "ask" ? " disabled" : ""}>${i < 9 ? `<kbd>${i + 1}</kbd>` : ""}${esc(o)}</button>`).join("")}</div>`
      : `<form class="typed" id="f" autocomplete="off"><input id="answer" type="text" autocapitalize="off" spellcheck="false" placeholder="Type, then press Enter" aria-label="Your answer"${state.phase !== "ask" ? " disabled" : ""}><button class="btn" type="submit"${state.phase !== "ask" ? " disabled" : ""}>Check</button></form>`}
    ${state.phase === "wrong" ? state.fb : ""}
    <div class="actions">
      ${state.phase === "wrong"
        ? `<button class="btn" id="next" type="button">Next</button><span class="tip"><kbd>Enter</kbd></span>`
        : `<span class="tip">${kind === "choice" ? "Keys <kbd>1</kbd>–<kbd>9</kbd> pick a choice." : "Accents and capitals don't matter."}</span><span class="spacer"></span><button class="btn ghost small" id="idk" type="button">Show answer</button>`}
    </div>`;
  if (state.phase === "wrong") {
    const marks = state.marks;
    if (marks) card.querySelectorAll(".choice").forEach(b => { const o = opts[+b.dataset.i];
      if (o === marks.right) b.classList.add("right"); else if (o === marks.picked) b.classList.add("wrong"); });
    document.getElementById("next").addEventListener("click", advance);
    document.getElementById("next").focus();
    if (kind !== "choice") document.getElementById("answer").value = state.typed || "";
    return;
  }
  document.getElementById("idk").addEventListener("click", () => check(null));
  if (kind === "choice") {
    card.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => check(opts[+b.dataset.i])));
  } else {
    const f = document.getElementById("f"), inp = document.getElementById("answer");
    f.addEventListener("submit", e => { e.preventDefault(); if (inp.value.trim()) check(inp.value); });
    inp.focus({ preventScroll: true });
  }
}

function check(raw) {
  const q = state.queue[0], it = q.it, d = srcDeck(q), kind = kindOf(q);
  const exp = answerOf(q, kind);
  const ok = raw !== null && (kind === "choice" ? raw === it[1] : exp.some(e => variants(e).includes(clean(raw))));
  const shown = kind === "choice" ? it[1] : show(exp[0]);
  const why = kind === "name" || kind === "translit" ? LOOKALIKE_NOTE[it[0]] : it[2];
  const gk = s => isGreek(s) ? `<span class="gk" lang="el">${esc(s)}</span>` : esc(s);
  state.opts = kind === "choice" ? state.opts : null;
  if (ok) {
    state.prev = `<p class="prev">✓ ${gk(it[0])} → <b>${gk(shown)}</b>${why && kind !== "name" && kind !== "translit" ? ` · ${gk(why)}` : ""}</p>`;
    if (d.kind === "both" && state.stage === 0) { state.stage = 1; state.opts = null; return render(); }
    state.stage = 0;
    if (!state.missed.has(q.id)) state.firstTry.add(q.id);
    state.queue.shift(); state.opts = null;
    return render();
  }
  const key = it[0] + (d.kind === "both" ? (kind === "name" ? " (name)" : " (letter)") : "");
  const list = state.missed.get(q.id) || [];
  list.push(`${key}: ${raw === null ? "showed answer" : `typed "${raw.trim()}"`}`);
  state.missed.set(q.id, list);
  state.phase = "wrong"; state.typed = raw || "";
  state.marks = kind === "choice" ? { right: it[1], picked: raw } : null;
  state.fb = `<div class="fb bad"><span class="head">${raw === null ? "Answer" : "Not quite"}: <span class="${isGreek(shown) ? "gk" : "ans"}">${esc(shown)}</span>${raw !== null && kind !== "choice" ? ` · you typed <span class="ans">${esc(raw.trim())}</span>` : ""}</span>
    ${why ? `<span class="why">${gk(why)}</span>` : ""}<span class="tip">It will come back in a few questions.</span></div>`;
  render();
}

function advance() {
  const item = state.queue.shift();
  state.queue.splice(Math.min(3, state.queue.length), 0, item);
  state.phase = "ask"; state.stage = 0; state.prev = ""; state.opts = null; state.marks = null;
  render();
}

function finish() {
  const right = state.firstTry.size, total = state.total;
  const misses = [...state.missed.values()].flat();
  const date = new Date().toISOString().slice(0, 10);
  const line = `${date} ${state.d.label}: ${right}/${total} first try` + (misses.length ? `; missed ${misses.join(", ")}` : "; no misses");
  history.push(line); store("gd-history", history.slice(-80)); renderLog();
  lastScores[state.deckKey] = [right, total]; store("gd-last", lastScores); renderNav(state.deckKey);
  const g = GROUPS.find(g => g.entries.includes(state.deckKey)), decks = g.entries.filter(e => typeof e === "string");
  const nextKey = decks[decks.indexOf(state.deckKey) + 1];
  card.innerHTML = `
    <div class="done">
      <p class="ask">${esc(state.d.label)} finished</p>
      <p class="big">${right} / ${total}</p>
      <p class="tip">${misses.length ? "First tries only. Every missed item came back until you got it." : "Every item right first time."}</p>
      ${misses.length ? `<ul>${misses.map(m => `<li>${esc(m)}</li>`).join("")}</ul>` : ""}
      <div class="actions"><button class="btn${nextKey ? " ghost" : ""}" id="again" type="button">Go again</button>
        ${nextKey ? `<button class="btn" id="nextdeck" type="button">Next: ${esc(shortLabel(DECKS[nextKey].label))}</button>` : ""}</div>
    </div>`;
  const key = state.deckKey;
  document.getElementById("again").addEventListener("click", () => start(key));
  if (nextKey) { document.getElementById("nextdeck").addEventListener("click", () => start(nextKey)); document.getElementById("nextdeck").focus(); }
  state = null;
}

document.addEventListener("keydown", e => {
  if (!state || e.metaKey || e.ctrlKey || e.altKey) return;
  if (state.phase === "wrong" && e.key === "Enter") { e.preventDefault(); return advance(); }
  if (state.phase === "ask" && /^[1-9]$/.test(e.key) && document.activeElement?.id !== "answer") {
    const b = card.querySelector(`.choice[data-i="${+e.key - 1}"]`); if (b) { e.preventDefault(); b.click(); }
  }
});

document.getElementById("copy").addEventListener("click", () => {
  const text = logEl.textContent, out = document.getElementById("copied");
  const sel = () => { const r = document.createRange(); r.selectNodeContents(logEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); out.textContent = "Selected. Copy it with your keyboard."; };
  try { navigator.clipboard.writeText(text).then(() => { out.textContent = "Copied. Paste it in the chat."; }, sel); } catch (e) { sel(); }
});

renderLog();
const saved = load("gd-deck", "sheet:key");
if (saved.startsWith("sheet:") && SHEETS[saved.slice(6)]) openSheet(saved.slice(6));
else start(DECKS[saved] ? saved : "lookalike");
</script>
