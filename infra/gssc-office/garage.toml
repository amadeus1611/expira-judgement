# Single-node Garage. Grow storage by adding disks (data_dir list) or nodes;
# raise replication_factor to 3 once three nodes exist.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret and admin token come from GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN.

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"
